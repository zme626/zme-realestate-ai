<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة العقارات الذكية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🏠 منصة العقارات الذكية</h1>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="login.html">تسجيل الدخول</a>
      <a href="dashboard.html">لوحة التحكم</a>
    </nav>
  </header>

  <section id="search">
    <h2>ابحث عن عقارك المثالي</h2>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث بالمدينة أو السعر أو النوع...">
      <select id="typeSelect">
        <option value="all">الكل</option>
        <option value="sale">بيع</option>
        <option value="rent">إيجار</option>
      </select>
      <button onclick="searchProperties()">🔍 بحث</button>
    </div>
  </section>

  <section id="properties">
    <h2>أحدث العقارات</h2>
    <div id="propertyList" class="property-list"></div>
  </section>

  <footer>
    <p>© 2025 جميع الحقوق محفوظة لمنصة العقارات الذكية</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
