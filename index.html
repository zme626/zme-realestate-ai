<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة عقار الذكية - بيتك الجديد يبدأ من هنا</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <div class="logo">عقار الذكية</div>
            <nav class="main-nav">
                <a href="index.html" class="active">الرئيسية</a>
                <a href="#">عقارات للبيع</a>
                <a href="#">عقارات للإيجار</a>
                <a href="dashboard.html" class="btn btn-primary">أضف عقارك</a>
            </nav>
            <button class="nav-toggle">☰</button>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>اكتشف منزل أحلامك بسهولة وذكاء</h1>
                <p>نستخدم أحدث التقنيات لنقدم لك أفضل العقارات التي تناسب أسلوب حياتك.</p>
                <div class="search-box">
                    <input type="text" id="main-search" placeholder="ابحث بالمدينة، الحي، أو اسم العقار...">
                    <button id="search-btn">بحث</button>
                </div>
            </div>
        </section>

        <section class="featured-properties">
            <div class="container">
                <h2>أحدث العقارات المضافة</h2>
                <div id="property-grid" class="property-grid">
                    <!-- سيتم ملء العقارات هنا عبر JavaScript -->
                </div>
            </div>
        </section>

        <section class="recommendations">
            <div class="container">
                <h2>قد يعجبك أيضاً</h2>
                <div id="recommendations-grid" class="property-grid">
                    <!-- سيتم ملء التوصيات هنا -->
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 منصة عقار الذكية. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
