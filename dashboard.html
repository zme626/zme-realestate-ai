<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منصة عقار الذكية</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيقات خاصة بصفحة لوحة التحكم */
        .dashboard-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            padding: 40px 0;
        }
        .form-panel, .list-panel {
            background-color: var(--white-color);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        .form-panel {
            flex: 1;
            min-width: 320px;
        }
        .list-panel {
            flex: 2;
        }
        .form-panel h2, .list-panel h2 {
            margin-top: 0;
            color: var(--primary-color);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-family: var(--font-family);
            box-sizing: border-box;
        }
        .property-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .property-item:last-child {
            border-bottom: none;
        }
        .property-item-info h4 { margin: 0 0 5px; }
        .property-item-info p { margin: 0; color: var(--light-text); }
        .actions button {
            margin-right: 10px;
            background: none;
            border: 1px solid;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-delete { border-color: #E53935; color: #E53935; }
        .btn-edit { border-color: var(--primary-color); color: var(--primary-color); }

        @media (max-width: 992px) {
            .dashboard-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <div class="logo"><a href="index.html" style="text-decoration:none; color: var(--primary-color);">عقار الذكية</a></div>
            <nav class="main-nav">
                <a href="index.html">الرئيسية</a>
                <a href="#" onclick="logout()">تسجيل الخروج</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="dashboard-container">
            <div class="form-panel">
                <h2 id="form-title">أضف عقاراً جديداً</h2>
                <form id="property-form">
                    <input type="hidden" id="property-id">
                    <div class="form-group">
                        <label for="title">عنوان العقار</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label for="city">المدينة</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label for="price">السعر</label>
                        <input type="number" id="price" required>
                    </div>
                    <div class="form-group">
                        <label for="area">المساحة (م²)</label>
                        <input type="number" id="area" required>
                    </div>
                    <div class="form-group">
                        <label for="rooms">عدد الغرف</label>
                        <input type="number" id="rooms" required>
                    </div>
                    <div class="form-group">
                        <label for="baths">عدد الحمامات</label>
                        <input type="number" id="baths" required>
                    </div>
                    <div class="form-group">
                        <label for="type">نوع الإعلان</label>
                        <select id="type">
                            <option value="sale">بيع</option>
                            <option value="rent">إيجار</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">حفظ العقار</button>
                </form>
            </div>

            <div class="list-panel">
                <h2>عقاراتي</h2>
                <div id="my-properties-list">
                    <!-- سيتم عرض العقارات هنا -->
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const PROPS_KEY = 'smart_properties_v1';
            const form = document.getElementById('property-form');
            const propertyListContainer = document.getElementById('my-properties-list');
            const formTitle = document.getElementById('form-title');
            const propertyIdInput = document.getElementById('property-id');

            function getProperties() {
                return JSON.parse(localStorage.getItem(PROPS_KEY) || '[]');
            }

            function saveProperties(properties) {
                localStorage.setItem(PROPS_KEY, JSON.stringify(properties));
            }

            function renderProperties() {
                const properties = getProperties();
                propertyListContainer.innerHTML = '';
                if (properties.length === 0) {
                    propertyListContainer.innerHTML = '<p>لم تقم بإضافة أي عقارات بعد.</p>';
                    return;
                }
                properties.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'property-item';
                    item.innerHTML = `
                        <div class="property-item-info">
                            <h4>${p.title}</h4>
                            <p>${p.city} - ${p.price.toLocaleString()} ريال</p>
                        </div>
                        <div class="actions">
                            <button class="btn-edit" onclick="window.editProperty(${p.id})">تعديل</button>
                            <button class="btn-delete" onclick="window.deleteProperty(${p.id})">حذف</button>
                        </div>
                    `;
                    propertyListContainer.appendChild(item);
                });
            }

            window.deleteProperty = (id) => {
                if (!confirm('هل أنت متأكد من حذف هذا العقار؟')) return;
                let properties = getProperties();
                properties = properties.filter(p => p.id !== id);
                saveProperties(properties);
                renderProperties();
            };

            window.editProperty = (id) => {
                const properties = getProperties();
                const property = properties.find(p => p.id === id);
                if (!property) return;

                formTitle.textContent = 'تعديل العقار';
                propertyIdInput.value = property.id;
                document.getElementById('title').value = property.title;
                document.getElementById('city').value = property.city;
                document.getElementById('price').value = property.price;
                document.getElementById('area').value = property.area;
                document.getElementById('rooms').value = property.rooms;
                document.getElementById('baths').value = property.baths;
                document.getElementById('type').value = property.type;
                window.scrollTo(0, 0); // الانتقال لأعلى الصفحة للتركيز على النموذج
            };

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const id = parseInt(propertyIdInput.value);
                const newProperty = {
                    title: document.getElementById('title').value,
                    city: document.getElementById('city').value,
                    price: parseInt(document.getElementById('price').value),
                    area: parseInt(document.getElementById('area').value),
                    rooms: parseInt(document.getElementById('rooms').value),
                    baths: parseInt(document.getElementById('baths').value),
                    type: document.getElementById('type').value,
                    image: 'https://via.placeholder.com/400x250.png/CCCCCC/FFFFFF?text=New+Property'
                };

                let properties = getProperties();
                if (id) { // وضع التعديل
                    const index = properties.findIndex(p => p.id === id);
                    if (index > -1) {
                        properties[index] = { ...properties[index], ...newProperty };
                    }
                } else { // وضع الإضافة
                    newProperty.id = Date.now(); // استخدام timestamp كـ ID فريد
                    properties.unshift(newProperty);
                }

                saveProperties(properties);
                renderProperties();
                form.reset();
                formTitle.textContent = 'أضف عقاراً جديداً';
                propertyIdInput.value = '';
            });

            // العرض الأولي عند تحميل الصفحة
            renderProperties();
        });

        function logout() {
            // يمكن إضافة منطق تسجيل الخروج هنا لاحقاً
            alert('تم تسجيل الخروج بنجاح.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
