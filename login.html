<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Nova HOME</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="container"><a href="index.html" class="logo">Nova HOME</a></div>
    </header>

    <div class="auth-page">
        <div class="auth-container">
            <!-- نموذج تسجيل الدخول -->
            <div class="auth-form" id="login">
                <h2>تسجيل الدخول</h2>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="البريد الإلكتروني" required>
                    <input type="password" id="login-password" placeholder="كلمة المرور" required>
                    <button type="submit" class="btn btn-primary full-width">تسجيل الدخول</button>
                </form>
                <div class="divider"><span>أو</span></div>
                <button onclick="authFunctions.signInWithGoogle()" class="btn-google full-width">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google logo">
                    المتابعة باستخدام جوجل
                </button>
                <p class="switch-form">ليس لديك حساب؟ <a href="#signup">أنشئ حسابًا الآن</a></p>
            </div>

            <!-- نموذج إنشاء حساب -->
            <div class="auth-form" id="signup" style="display:none;">
                <h2>إنشاء حساب جديد</h2>
                <form id="signup-form">
                    <input type="text" placeholder="الاسم بالكامل" required>
                    <input type="email" id="signup-email" placeholder="البريد الإلكتروني" required>
                    <input type="password" id="signup-password" placeholder="كلمة المرور" required>
                    <button type="submit" class="btn btn-primary full-width">إنشاء حساب</button>
                </form>
                <p class="switch-form">لديك حساب بالفعل؟ <a href="#login">سجل الدخول</a></p>
            </div>
        </div>
    </div>

    <!-- 1. ربط ملف Firebase (كما كان) -->
    <script type="module" src="static/js/firebase.js"></script>
    
    <!-- 2. كود ربط النماذج بالدوال (كما كان) -->
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            window.authFunctions.signInWithEmail(email, password);
        });

        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            window.authFunctions.signUpWithEmail(email, password);
        });
    </script>

    <!-- 3. === السطر المفقود الذي تم إضافته لإصلاح المشكلة === -->
    <script src="script.js"></script>
</body>
</html>
