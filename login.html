<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Nova HOME</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="navbar"><div class="container"><a href="index.html" class="logo">Nova HOME</a></div></header>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-form" id="login">
                <h2>تسجيل الدخول</h2>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="البريد الإلكتروني" required>
                    <input type="password" id="login-password" placeholder="كلمة المرور" required>
                    <button type="submit" class="btn btn-primary full-width">تسجيل الدخول</button>
                </form>
                <div class="divider"><span>أو</span></div>
                <button id="google-signin-btn" class="btn-google full-width">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google logo">
                    المتابعة باستخدام جوجل
                </button>
                <p class="switch-form">ليس لديك حساب؟ <a href="#signup">أنشئ حسابًا الآن</a></p>
            </div>
            <div class="auth-form" id="signup" style="display:none;">
                <h2>إنشاء حساب جديد</h2>
                <form id="signup-form">
                    <input type="text" id="signup-name" placeholder="الاسم بالكامل" required>
                    <input type="email" id="signup-email" placeholder="البريد الإلكتروني" required>
                    <input type="password" id="signup-password" placeholder="كلمة المرور" required>
                    <button type="submit" class="btn btn-primary full-width">إنشاء حساب</button>
                </form>
                <p class="switch-form">لديك حساب بالفعل؟ <a href="#login">سجل الدخول</a></p>
            </div>
        </div>
    </div>

    <!-- === هذا هو التصحيح الأهم === -->
    <!-- 1. تأكد من أن المسار صحيح 100% -->
    <script type="module" src="static/js/firebase.js"></script>
    
    <!-- 2. ربط ملف script.js الرئيسي -->
    <script src="script.js"></script>

    <!-- 3. الكود المُصحح بدون حلقة لا نهائية -->
    <script type="module">
        document.addEventListener('DOMContentLoaded', function() {
            // سننتظر قليلاً للتأكد من تحميل كل شيء
            setTimeout(() => {
                if (!window.authFunctions) {
                    // إذا لم يتم التحميل، نعرض رسالة خطأ واضحة بدلاً من التعليق
                    console.error("فشل تحميل دوال Firebase. تأكد من صحة المسار إلى firebase.js واتصالك بالإنترنت.");
                    alert("حدث خطأ في الاتصال بالخادم. يرجى تحديث الصفحة والمحاولة مرة أخرى.");
                    return;
                }

                document.getElementById('login-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    window.authFunctions.signInWithEmail(document.getElementById('login-email').value, document.getElementById('login-password').value);
                });

                document.getElementById('signup-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    window.authFunctions.signUpWithEmail(document.getElementById('signup-email').value, document.getElementById('signup-password').value, document.getElementById('signup-name').value);
                });

                document.getElementById('google-signin-btn').addEventListener('click', () => {
                    window.authFunctions.signInWithGoogle();
                });

            }, 500); // ننتظر نصف ثانية
        });
    </script>
</body>
</html>
