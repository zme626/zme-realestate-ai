<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <title>ملفي الشخصي - Nova HOME</title>

<body>

    <header class="navbar">

            <div class="navbar-left">
                <a href="index.html" class="logo">Nova HOME</a>
            </div>
            <div class="navbar-center">
                <nav class="main-nav">
                    <ul class="nav-links">
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="#">قائمة العقارات</a></li>
                        <li><a href="contact.html">اتصل بنا</a></li>

                <div class="user-profile-menu">

                </div>
            </div>
            <button class="hamburger-menu" id="hamburger-menu"><i class="fa-solid fa-bars"></i></button>

    <main class="page-header-section">
        <div class="container">
            <h1>الملف الشخصي</h1>
            <p>أهلاً بك في لوحة التحكم الخاصة بك.</p>
        </div>

    <section class="profile-page-section">
        <div class="container">
            <h2>قيد الإنشاء...</h2>
            <p>هذه الصفحة ستعرض قريبًا معلومات حسابك وعقاراتك المفضلة.</p>

    <script src="script.js"></script>
