<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا - Nova HOME</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="navbar-left"><a href="index.html" class="logo">Nova HOME</a></div>
            <div class="navbar-center">
                <nav class="main-nav">
                    <ul class="nav-links">
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="#">قائمة العقارات</a></li>
                        <li><a href="contact.html" class="active">اتصل بنا</a></li>
                    </ul>
                </nav>
            </div>
            <div class="navbar-right"></div>
            <button class="hamburger-menu" id="hamburger-menu"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>
    <main class="page-header-section">
        <div class="container"><h1>تواصل معنا</h1><p>نحن هنا لمساعدتك. أرسل لنا استفسارك أو تفضل بزيارتنا.</p></div>
    </main>
    <section class="contact-page-section">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-form-wrapper">
                    <h3>أرسل لنا رسالة</h3>
                    <form action="#">
                        <div class="form-group"><label for="name">الاسم الكامل</label><input type="text" id="name" required></div>
                        <div class="form-group"><label for="email">البريد الإلكتروني</label><input type="email" id="email" required></div>
                        <div class="form-group"><label for="subject">الموضوع</label><input type="text" id="subject" required></div>
                        <div class="form-group"><label for="message">رسالتك</label><textarea id="message" rows="6" required></textarea></div>
                        <button type="submit" class="btn btn-primary full-width">إرسال الرسالة</button>
                    </form>
                </div>
                <div class="contact-info-wrapper">
                    <h3>معلومات الاتصال</h3>
                    <div class="info-box">
                        <i class="fa-solid fa-location-dot"></i>
                        <div><h4>مقرنا الرئيسي</h4><p>شارع التسعين، القاهرة الجديدة، مصر</p></div>
                    </div>
                    <div class="info-box">
                        <i class="fa-solid fa-envelope"></i>
                        <div><h4>البريد الإلكتروني</h4><p>zmetap132@gmail.com</p></div>
                    </div>
                    <div class="info-box">
                        <i class="fa-solid fa-phone"></i>
                        <div><h4>الهاتف</h4><p>+201063051272</p></div>
                    </div>
                    <div id="contact-map"></div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="static/js/firebase.js"></script>
    <script src="script.js"></script>
    <script>
        const map = L.map('contact-map').setView([30.0272, 31.4919], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.marker([30.0272, 31.4919]).addTo(map).bindPopup('مقر Nova HOME').openPopup();
    </script>
</body>
</html>
